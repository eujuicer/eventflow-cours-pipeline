sonar.organization=eujuicer
sonar.projectKey=eujuicer_eventflow-cours-pipeline

# Code analyse
sonar.sources=backend,frontend
sonar.tests=qa
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/dist/**,qa/reports/**

# Evite le warning sur la version Python
sonar.python.version=3.12

# Bloque le job si la Quality Gate n'est pas respectee
sonar.qualitygate.wait=true

# Rapports d'analyse statique importes dans Sonar
sonar.python.bandit.reportPaths=bandit-report.json
sonar.python.ruff.reportPaths=ruff-report.json
